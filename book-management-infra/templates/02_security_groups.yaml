AWSTemplateFormatVersion: '2010-09-09'
Description: 'Book Management System - Security Groups and NACLs'

Parameters:
  ProjectName:
    Type: String
    Default: book-management

Outputs:
  AlbSgId:
    Value: !Ref AlbSecurityGroup
    Export:
      Name: !Sub '${ProjectName}-AlbSgId'

  Ec2SgId:
    Value: !Ref Ec2SecurityGroup
    Export:
      Name: !Sub '${ProjectName}-Ec2SgId'

  RdsSgId:
    Value: !Ref RdsSecurityGroup
    Export:
      Name: !Sub '${ProjectName}-RdsSgId'

  LambdaSgId:
    Value: !Ref LambdaSecurityGroup
    Export:
      Name: !Sub '${ProjectName}-LambdaSgId'

Resources:
  # ----------------------------------------
  # ALB Security Group
  # インターネットからHTTPS(443)のみ許可
  # HTTP(80)はHTTPSリダイレクト用
  # ----------------------------------------
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for ALB
      VpcId: !ImportValue
        Fn::Sub: '${ProjectName}-VpcId'
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS from internet
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP for redirect to HTTPS
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-alb-sg'

  # ----------------------------------------
  # EC2 Security Group
  # ALBからの8080ポートのみ許可（Spring Bootデフォルトポート）
  # インターネットから直接アクセス不可
  # ----------------------------------------
  Ec2SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for EC2 instances
      VpcId: !ImportValue
        Fn::Sub: '${ProjectName}-VpcId'
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref AlbSecurityGroup
          Description: Spring Boot from ALB only
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-ec2-sg'

  # ----------------------------------------
  # RDS Security Group
  # EC2とLambdaからのMySQL(3306)のみ許可
  # ----------------------------------------
  RdsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for RDS
      VpcId: !ImportValue
        Fn::Sub: '${ProjectName}-VpcId'
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          SourceSecurityGroupId: !Ref Ec2SecurityGroup
          Description: MySQL from EC2
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          SourceSecurityGroupId: !Ref LambdaSecurityGroup
          Description: MySQL from Lambda (batch)
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-rds-sg'

  # ----------------------------------------
  # Lambda Security Group
  # 夜間バッチ用LambdaがRDSに接続するため
  # ----------------------------------------
  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Lambda batch
      VpcId: !ImportValue
        Fn::Sub: '${ProjectName}-VpcId'
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-lambda-sg'

  # ----------------------------------------
  # NACL (Public Subnet)
  # ALBが属するサブネットへのアクセス制御
  # セキュリティグループより広めのルールで、
  # 詳細制御はセキュリティグループに委ねる
  # ----------------------------------------
  PublicNacl:
    Type: AWS::EC2::NetworkAcl
    Properties:
      VpcId: !ImportValue
        Fn::Sub: '${ProjectName}-VpcId'
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-public-nacl'

  PublicNaclInboundHTTPS:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref PublicNacl
      RuleNumber: 100
      Protocol: 6
      RuleAction: allow
      Egress: false
      CidrBlock: 0.0.0.0/0
      PortRange:
        From: 443
        To: 443

  PublicNaclInboundHTTP:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref PublicNacl
      RuleNumber: 110
      Protocol: 6
      RuleAction: allow
      Egress: false
      CidrBlock: 0.0.0.0/0
      PortRange:
        From: 80
        To: 80

  # エフェメラルポート: クライアントへのレスポンス返却に必要
  PublicNaclInboundEphemeral:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref PublicNacl
      RuleNumber: 120
      Protocol: 6
      RuleAction: allow
      Egress: false
      CidrBlock: 0.0.0.0/0
      PortRange:
        From: 1024
        To: 65535

  PublicNaclOutboundAll:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref PublicNacl
      RuleNumber: 100
      Protocol: -1
      RuleAction: allow
      Egress: true
      CidrBlock: 0.0.0.0/0

  PublicSubnetAzANaclAssociation:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties:
      SubnetId: !ImportValue
        Fn::Sub: '${ProjectName}-PublicSubnetAzA'
      NetworkAclId: !Ref PublicNacl

  # ----------------------------------------
  # NACL (Private Subnet)
  # EC2・RDSが属するサブネット
  # VPC内からのアクセスのみ許可
  # ----------------------------------------
  PrivateNacl:
    Type: AWS::EC2::NetworkAcl
    Properties:
      VpcId: !ImportValue
        Fn::Sub: '${ProjectName}-VpcId'
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-private-nacl'

  PrivateNaclInboundVpc:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref PrivateNacl
      RuleNumber: 100
      Protocol: -1
      RuleAction: allow
      Egress: false
      CidrBlock: 10.0.0.0/16

  PrivateNaclOutboundVpc:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref PrivateNacl
      RuleNumber: 100
      Protocol: -1
      RuleAction: allow
      Egress: true
      CidrBlock: 10.0.0.0/16

  # SSM VPCエンドポイント経由でのAWS APIアクセスに必要
  PrivateNaclOutboundHTTPS:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref PrivateNacl
      RuleNumber: 110
      Protocol: 6
      RuleAction: allow
      Egress: true
      CidrBlock: 0.0.0.0/0
      PortRange:
        From: 443
        To: 443

  PrivateSubnetAzANaclAssociation:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties:
      SubnetId: !ImportValue
        Fn::Sub: '${ProjectName}-PrivateSubnetAzA'
      NetworkAclId: !Ref PrivateNacl

  PrivateSubnetAzCNaclAssociation:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties:
      SubnetId: !ImportValue
        Fn::Sub: '${ProjectName}-PrivateSubnetAzC'
      NetworkAclId: !Ref PrivateNacl