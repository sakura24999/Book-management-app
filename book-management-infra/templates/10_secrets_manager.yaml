AWSTemplateFormatVersion: '2010-09-09'
Description: 'Book Management System - Secrets Manager'

Parameters:
  ProjectName:
    Type: String
    Default: book-management

Outputs:
  SecretArn:
    Value: !Ref DBCredentialsSecret
    Export:
      Name: !Sub '${ProjectName}-SecretArn'

  SecretName:
    Value: !Sub '${ProjectName}/db-credentials'
    Export:
      Name: !Sub '${ProjectName}-SecretName'

Resources:
  # ----------------------------------------
  # Secrets Manager シークレット
  # DBパスワードをソースコードに直書きせず
  # ここで一元管理する
  # EC2起動時・Lambda実行時に動的取得
  # ----------------------------------------
  DBCredentialsSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${ProjectName}/db-credentials'
      Description: 'RDS credentials for Book Management System'
      # パスワードの値はCloudFormationに書かず
      # デプロイ後にCLIで更新する
      SecretString: !Sub |
        {
          "username": "admin",
          "password": "PLACEHOLDER",
          "host": "book-management-rds.cb2c804qirs0.ap-northeast-1.rds.amazonaws.com",
          "port": "3306",
          "dbname": "bookmanagement"
        }
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-db-credentials'

  # ----------------------------------------
  # EC2のIAMロールにSecrets Manager読み取り権限を追加
  # EC2がSecrets Managerからパスワードを取得するために必要
  # ----------------------------------------
  SecretsManagerPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub '${ProjectName}-secrets-manager-policy'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
              - secretsmanager:DescribeSecret
            Resource: !Ref DBCredentialsSecret
      # EC2とLambdaの両方のロールに適用
      Roles:
        - !Sub '${ProjectName}-ec2-role'
        - !Sub '${ProjectName}-lambda-role'